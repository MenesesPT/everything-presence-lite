substitutions:
  update_checks: true

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

improv_ble:
  authorizer: none


esphome:
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            lambda: 'return !wifi::global_wifi_component->has_sta();'
          then:
            - logger.log: "No WiFi credentials configured, enabling BLE for Improv setup"
            - ble.enable

wifi:
  on_connect:
    - ble.enable
    - delay: 5s
    - esp32_ble_tracker.start_scan:
        continuous: true
